accomp_heading1: "Un avocat pour votre divorce amiable"
accomp_heading2: "à Nice et Cannes"
accomp_text: |-
  Engager une procédure de divorce soulève de nombreuses questions, même lorsque les époux sont d'accord sur leur séparation.

  Il faut notamment déterminer les conséquences du divorce concernant les enfants, les pensions alimentaires, le logement familial, les biens communs et, le cas échéant, la prestation compensatoire.

  L'objectif du divorce par consentement mutuel est de parvenir à **un accord complet et juridiquement sécurisé**.
accomp_list_intro: "Maître LAPERONNIE vous accompagne dans les différentes étapes de cette procédure :"
accomp_list:
  - "Analyse de votre situation familiale et patrimoniale"
  - "Conseil sur les conséquences juridiques et financières du divorce"
  - "Échanges avec l'avocat de votre conjoint"
  - "Préparation et examen de la convention de divorce"
  - "Organisation de la signature à Nice ou à Cannes"
  - "Suivi des formalités jusqu'au dépôt de la convention au rang des minutes d'un notaire"
accomp_outro: "Vous bénéficiez ainsi d'un accompagnement personnalisé, avec la possibilité d'organiser une grande partie des échanges à distance et une présence effective de votre avocat lors de la signature."

