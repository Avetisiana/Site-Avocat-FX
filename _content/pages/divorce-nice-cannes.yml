intro_heading1: "Vous souhaitez divorcer"
intro_heading2: "à l'amiable ?"
intro_text: |-
  Le divorce par consentement mutuel permet aux époux qui s'accordent sur le principe de leur séparation et sur ses conséquences de divorcer, dans la plupart des situations, **sans audience devant le juge aux affaires familiales**.

  Cette procédure nécessite toutefois une préparation juridique rigoureuse et l'intervention de **deux avocats distincts**, chacun chargé de conseiller et de défendre les intérêts de son client.

  Maître LAPERONNIE, avocat au barreau de la Charente depuis 2009, accompagne les personnes souhaitant engager un divorce par consentement mutuel à Nice, Cannes et dans les Alpes-Maritimes.

  Il intervient personnellement dans la région et organise les rendez-vous de signature dans les locaux de confrères partenaires à Nice ou à Cannes.

  La préparation du dossier peut être réalisée en grande partie à distance, afin de faciliter les démarches des époux.
